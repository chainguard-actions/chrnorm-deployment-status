name: Test GitHub Enterprise base URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: in_progress
          token: fake-token-for-testing
          deployment-id: '42'
          github-base-url: 'https://github.example.com/api/v3'
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to invalid token/deployment-id)"
          echo "PASS: github-base-url input was accepted"
