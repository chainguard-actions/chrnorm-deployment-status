name: Test deployment status with custom repo and owner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: failure
          token: fake-token-for-testing
          deployment-id: "99999"
          repo: my-repo
          owner: my-org
          github-base-url: "https://api.github.com"
          description: "Deployment failed"
          log-url: "https://example.com/logs/failure"
          environment: staging
          auto-inactive: "true"
      - name: Assert action ran (may fail due to invalid token/deployment-id)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token and deployment-id
          # We just verify it ran and produced an outcome
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
