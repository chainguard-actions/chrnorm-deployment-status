name: Test basic deployment status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: success
          token: fake-token-for-testing
          deployment-id: "1"
      - name: Assert action ran (may fail due to invalid token/deployment)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token/deployment-id are fake,
          # but we just need to verify the inputs are accepted and the action runs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
