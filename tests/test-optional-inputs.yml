name: Test optional deployment status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: failure
          token: fake-token-for-testing
          deployment-id: "42"
          description: "Deployment failed in test environment"
          environment: staging
          log-url: "https://example.com/logs/42"
          environment-url: "https://staging.example.com"
          owner: test-owner
          repo: test-repo
          auto-inactive: "false"
          github-base-url: "https://api.github.com"
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with all optional inputs"
