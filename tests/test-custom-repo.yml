name: Test custom repo and owner inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          state: in_progress
          token: ${{ github.token }}
          deployment-id: "1"
          repo: test-repo
          owner: test-owner
          github-base-url: "https://api.github.com"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action was invoked with custom repo/owner/github-base-url inputs"
