name: Test custom repo and owner deployment status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          state: failure
          token: ${{ github.token }}
          deployment-id: "1"
          repo: my-repo
          owner: my-owner
          github-base-url: "https://api.github.com"
          auto-inactive: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail because the custom repo/owner/deployment-id
          # likely don't exist, but we verify it was invoked with all inputs.
          # A 404 or similar API error is acceptable — what matters is the action
          # was called with the repo, owner, and github-base-url inputs.
          echo "PASS: action was invoked with repo, owner, and github-base-url inputs"
