name: Test deployment status with custom repo and owner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: failure
          token: ${{ github.token }}
          deployment-id: "1"
          repo: "my-repo"
          owner: "my-owner"
          github-base-url: "https://api.github.com"
          auto-inactive: "true"
      - name: Assert action ran (API call may fail in test environment)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed"
