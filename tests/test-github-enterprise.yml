name: Test GitHub Enterprise and remaining inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: in_progress
          token: fake-token-for-testing
          deployment-id: "99"
          github-base-url: https://github.example.com/api/v3
          environment-url: https://staging.example.com
          auto-inactive: "false"
      - name: Assert action ran with github-base-url input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token/deployment-id are fake,
          # but we just need to verify the inputs are accepted and the action runs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with github-base-url (outcome: ${{ steps.action.outcome }})"
