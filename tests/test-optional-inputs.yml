name: Test optional deployment status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: failure
          token: fake-token-for-testing
          deployment-id: "42"
          repo: my-repo
          owner: my-owner
          log-url: https://example.com/logs
          environment: staging
          description: "Deployment failed in staging"
      - name: Assert action ran with optional inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token/deployment-id are fake,
          # but we just need to verify the inputs are accepted and the action runs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with optional inputs (outcome: ${{ steps.action.outcome }})"
