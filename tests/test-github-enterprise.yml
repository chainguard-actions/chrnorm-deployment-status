name: Test GitHub Enterprise base URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: in_progress
          token: fake-token-for-testing
          deployment-id: "99"
          github-base-url: "https://github.example.com/api/v3"
      - name: Assert action ran (may fail due to invalid token/URL)
        run: |
          echo "Action completed (with or without error due to fake token/URL)"
          echo "PASS"
