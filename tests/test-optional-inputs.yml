name: Test optional deployment status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          state: failure
          token: ${{ github.token }}
          deployment-id: "1"
          description: "Test deployment description"
          environment: staging
          log-url: "https://example.com/logs"
          environment-url: "https://example.com"
          auto-inactive: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action was invoked with optional inputs"
