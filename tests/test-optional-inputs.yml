name: Test optional deployment status inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          state: failure
          token: fake-token-for-testing
          deployment-id: '1'
          repo: my-repo
          owner: my-owner
          environment: staging
          description: 'Deployment failed during testing'
          log-url: 'https://example.com/logs/1'
          environment-url: 'https://staging.example.com'
          auto-inactive: 'false'
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to invalid token/deployment-id)"
          echo "PASS: optional inputs were accepted"
